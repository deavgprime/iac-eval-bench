<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">two-routes</title><desc id="desc">Fixing pricing.py charges 80 dollars and passes independent checks. Changing the checks charges 120 dollars and fails independent verification. Both pass their local checks.</desc><rect width="1600" height="850" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#087c55" text-anchor="start">THE DISCOUNT EXAMPLE</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="50" font-weight="700" fill="#102334" text-anchor="start">Two passes. One correct discount.</text><text x="64" y="169" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#536777" text-anchor="start">$100 order. 20% discount. The correct total is $80.</text><rect x="64" y="218" width="692" height="475" rx="18" fill="#ecfaf2" stroke="none" stroke-width="2"/><text x="94" y="269" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#102334" text-anchor="start">Fix the calculation</text><text x="94" y="314" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Change pricing.py</text><text x="94" y="377" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Customer is charged</text><text x="724" y="382" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" fill="#087c55" text-anchor="end">$80</text><path d="M94 411 H726" fill="none" stroke="#d5e4df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="94" y="457" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#102334" text-anchor="start">Original checks expect $80</text><text x="94" y="516" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Local checks</text><rect x="570" y="480" width="156" height="52" rx="26" fill="white" stroke="none" stroke-width="2"/><text x="648" y="515" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087c55" text-anchor="middle">PASS</text><text x="94" y="578" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Independent checks</text><text x="726" y="578" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#087c55" text-anchor="end">PASS</text><text x="94" y="644" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#087c55" text-anchor="start">ACCEPT</text><text x="726" y="644" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#536777" text-anchor="end">Only permitted edits</text><rect x="844" y="218" width="692" height="475" rx="18" fill="#fff1ef" stroke="none" stroke-width="2"/><text x="874" y="269" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#102334" text-anchor="start">Change the expected answer</text><text x="874" y="314" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Leave the calculation broken</text><text x="874" y="377" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Customer is charged</text><text x="1504" y="382" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" fill="#bd403f" text-anchor="end">$120</text><path d="M874 411 H1506" fill="none" stroke="#d5e4df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="874" y="457" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#102334" text-anchor="start">Edited checks expect $120</text><text x="874" y="516" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Local checks</text><rect x="1350" y="480" width="156" height="52" rx="26" fill="white" stroke="none" stroke-width="2"/><text x="1428" y="515" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087c55" text-anchor="middle">PASS</text><text x="874" y="578" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Independent checks</text><text x="1506" y="578" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#bd403f" text-anchor="end">FAIL</text><text x="874" y="644" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#bd403f" text-anchor="start">REJECT</text><text x="1506" y="644" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#536777" text-anchor="end">Forbidden test edit</text><path d="M64 742 H1536" fill="none" stroke="#d5e4df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="798" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#102334" text-anchor="middle">The check can pass while the customer is still overcharged.</text></svg>
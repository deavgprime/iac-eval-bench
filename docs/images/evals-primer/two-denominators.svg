<text x="362" y="627" font-family="Noto Serif, serif" font-size="59" font-weight="700" text-anchor="start" fill="#172b43">= 75%</text>
<text x="70" y="738" font-family="Noto Serif, serif" font-size="26" font-weight="400" text-anchor="start" fill="#58616a">Timeouts excluded</text>
<text x="750" y="480" font-family="Noto Serif, serif" font-size="29" font-weight="700" text-anchor="start" fill="#172b43">Among all attempts</text>
<text x="912" y="576" font-family="Noto Serif, serif" font-size="69" font-weight="700" text-anchor="middle" fill="#176d9b">6</text>
<path d="M 854 597 L 970 596" stroke="#172b43" stroke-width="3"/>
<text x="912" y="681" font-family="Noto Serif, serif" font-size="69" font-weight="700" text-anchor="middle" fill="#172b43">10</text>
<text x="1042" y="627" font-family="Noto Serif, serif" font-size="59" font-weight="700" text-anchor="start" fill="#172b43">= 60%</text>
<text x="750" y="738" font-family="Noto Serif, serif" font-size="26" font-weight="400" text-anchor="start" fill="#58616a">Timeouts included</text>
<text x="700" y="805" font-family="Noto Serif, serif" font-size="27" font-weight="400" text-anchor="middle" fill="#172b43">The answers did not change. The denominator did.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="785" viewBox="0 0 1600 785" role="img" aria-labelledby="title desc"><title id="title">commit-gap</title><desc id="desc">Separate commits allow a crash after the order but before its receipt, creating a duplicate on retry. One database transaction commits both or rolls back both. The split control created two orders in all three runs with a durable key.</desc><rect width="1600" height="785" fill="white"/><text x="64" y="58" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#21775c" text-anchor="start">THE CRASH BOUNDARY</text><text x="64" y="126" font-family="DejaVu Sans,sans-serif" font-size="47" font-weight="700" fill="#172d3c" text-anchor="start">The same key cannot replay a missing receipt.</text><rect x="64" y="190" width="1472" height="224" rx="16" fill="#fff0e9"/><text x="94" y="240" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#aa3f30" text-anchor="start">Separate transactions</text><rect x="94" y="269" width="390" height="92" rx="16" fill="white"/><text x="289" y="327" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#172d3c" text-anchor="middle">Commit order</text><path d="M500 315 H625" stroke="#aa3f30" stroke-width="3" fill="none"/><path d="M615 307 L625 315 L615 323" stroke="#aa3f30" stroke-width="3" fill="none"/><text x="720" y="323" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#aa3f30" text-anchor="middle">CRASH</text><path d="M815 315 H940" stroke="#aa3f30" stroke-width="3" fill="none"/><path d="M930 307 L940 315 L930 323" stroke="#aa3f30" stroke-width="3" fill="none"/><rect x="956" y="269" width="548" height="92" rx="16" fill="white"/><text x="1230" y="327" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#172d3c" text-anchor="middle">Receipt was never committed</text><text x="94" y="394" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#aa3f30" text-anchor="start">Restart + same key: no receipt found, so the retry creates another order.</text><rect x="64" y="450" width="1472" height="224" rx="16" fill="#d8f2e9"/><text x="94" y="500" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#21775c" text-anchor="start">One transaction</text><rect x="94" y="529" width="820" height="92" rx="16" fill="white"/><text x="504" y="587" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#172d3c" text-anchor="middle">Order + receipt commit together</text><path d="M930 575 H1045" stroke="#21775c" stroke-width="3" fill="none"/><path d="M1035 567 L1045 575 L1035 583" stroke="#21775c" stroke-width="3" fill="none"/><text x="1270" y="585" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#21775c" text-anchor="middle">Replay original result</text><text x="94" y="654" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#21775c" text-anchor="start">Before commit: both roll back. After commit: both are available on restart.</text><text x="64" y="735" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#596975" text-anchor="start">Measured split-transaction control: 2 orders in each of 3 runs with the same durable key.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc"><title id="title">investigation</title><desc id="desc">Check the setup, compare the same tasks with and without an assessment banner, then test on fresh tasks and retain all attempts. Performance changes alone do not prove intent.</desc><rect width="1600" height="780" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#0755e9" text-anchor="start">A CONTROLLED COMPARISON</text><text x="64" y="116" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="700" fill="#071d49" text-anchor="start">Investigate the gap</text><text x="64" y="166" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#4a607c" text-anchor="start">Change one condition. Keep the comparison fair.</text><circle cx="87" cy="241" r="23" fill="#0755e9"/><text x="87" y="250" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">1</text><text x="64" y="313" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#071d49" text-anchor="start">Check the setup</text><text x="64" y="356" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#4a607c" text-anchor="start">Scorer, tools and budget</text><circle cx="627" cy="241" r="23" fill="#0755e9"/><text x="627" y="250" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">2</text><text x="604" y="313" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#071d49" text-anchor="start">Compare matched runs</text><text x="604" y="356" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#4a607c" text-anchor="start">Change one suspected cue</text><circle cx="1167" cy="241" r="23" fill="#0755e9"/><text x="1167" y="250" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">3</text><text x="1144" y="313" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#071d49" text-anchor="start">Test on fresh tasks</text><text x="1144" y="356" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#4a607c" text-anchor="start">Keep every attempt</text><rect x="64" y="403" width="392" height="170" rx="18" fill="#eef5ff" stroke="none" stroke-width="2"/><text x="92" y="448" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#071d49" text-anchor="start">Verify the run</text><path d="M94 482 L103 491 L119 471" stroke="#0755e9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="136" y="491" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#071d49" text-anchor="start">Outputs and errors</text><path d="M94 528 L103 537 L119 517" stroke="#0755e9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="136" y="537" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#071d49" text-anchor="start">Same resource limits</text><rect x="604" y="403" width="392" height="76" rx="14" fill="#eef5ff" stroke="none" stroke-width="2"/><text x="800" y="450" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#071d49" text-anchor="middle">With assessment banner</text><rect x="604" y="497" width="392" height="76" rx="14" fill="white" stroke="#cdddf4" stroke-width="2"/><text x="800" y="544" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#071d49" text-anchor="middle">Without banner</text><rect x="1144" y="403" width="392" height="170" rx="18" fill="#eef5ff" stroke="none" stroke-width="2"/><text x="1172" y="448" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#071d49" text-anchor="start">Retain the evidence</text><text x="1172" y="491" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#071d49" text-anchor="start">Failures and successes</text><text x="1172" y="537" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#071d49" text-anchor="start">Prompts, traces and limits</text><path d="M479 488 H577 M565 476 L577 488 L565 500" stroke="#cdddf4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1019 488 H1117 M1105 476 L1117 488 L1105 500" stroke="#cdddf4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 625 H1536" stroke="#cdddf4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="683" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#071d49" text-anchor="middle">A performance change is a reason to investigate.</text><text x="800" y="727" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#4a607c" text-anchor="middle">It does not establish intent on its own.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="741" viewBox="0 0 1600 741" role="img" aria-labelledby="title desc"><title id="title">grader-calibration</title><desc id="desc">A known-good answer should pass, a known-bad answer should fail, and a harmless variation should still pass. These are conceptual grader controls, not measured model results.</desc><rect width="1600" height="741" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#246592" text-anchor="start">CHECK THE GRADER</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="49" font-weight="700" fill="#182735" text-anchor="start">Start with outcomes you already understand.</text><text x="64" y="169" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#62707b" text-anchor="start">Conceptual controls for a task requesting three replicas.</text><rect x="64" y="226" width="432" height="346" rx="16" fill="#f0f5f9"/><text x="89" y="278" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#182735" text-anchor="start">Known-good</text><text x="89" y="342" font-family="DejaVu Sans Mono, sans-serif" font-size="29" font-weight="400" fill="#182735" text-anchor="start">&quot;replicas&quot;: 3</text><text x="89" y="401" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">Meets the requirement</text><text x="89" y="439" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start"></text><text x="89" y="519" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#62707b" text-anchor="start">Expected:</text><text x="469" y="519" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#246592" text-anchor="end">PASS</text><rect x="584" y="226" width="432" height="346" rx="16" fill="#fff0e6"/><text x="609" y="278" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#182735" text-anchor="start">Known-bad</text><text x="609" y="342" font-family="DejaVu Sans Mono, sans-serif" font-size="29" font-weight="400" fill="#182735" text-anchor="start">&quot;replicas&quot;: 2</text><text x="609" y="401" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">Contains a specific</text><text x="609" y="439" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">requirement error</text><text x="609" y="519" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#62707b" text-anchor="start">Expected:</text><text x="989" y="519" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#b94d16" text-anchor="end">FAIL</text><rect x="1104" y="226" width="432" height="346" rx="16" fill="#f0f5f9"/><text x="1129" y="278" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#182735" text-anchor="start">Harmless variation</text><text x="1129" y="342" font-family="DejaVu Sans Mono, sans-serif" font-size="29" font-weight="400" fill="#182735" text-anchor="start">&quot;replicas&quot;: 3</text><text x="1129" y="401" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">Includes a compatible</text><text x="1129" y="439" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">extra label</text><text x="1129" y="519" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#62707b" text-anchor="start">Expected:</text><text x="1509" y="519" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#246592" text-anchor="end">PASS</text><path d="M64 628 H1536" stroke="#dce3e8" stroke-width="2"/><text x="800" y="685" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#182735" text-anchor="middle">These controls test the grader, not the model&#x27;s ability.</text></svg>

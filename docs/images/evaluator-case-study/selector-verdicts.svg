<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="798" viewBox="0 0 1600 798" role="img" aria-labelledby="title desc"><title id="title">selector-verdicts</title><desc id="desc">A selector requiring app=api and app NotIn [api] contradicts the pod labels and must fail. An extra team=platform label leaves the required app=api match intact and must pass. Both old verdicts were reversed by the fixes.</desc><rect width="1600" height="798" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#b34b14" text-anchor="start">TWO SCORING ERRORS</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="49" font-weight="700" fill="#202126" text-anchor="start">Catch wrong passes and wrong failures.</text><text x="64" y="168" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#656a74" text-anchor="start">The selector must match the submitted pod labels.</text><rect x="64" y="219" width="692" height="420" rx="16" fill="#f5f5f4"/><text x="94" y="270" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#202126" text-anchor="start">Conflicting selector</text><text x="94" y="330" font-family="DejaVu Sans Mono, sans-serif" font-size="26" font-weight="400" fill="#202126" text-anchor="start">matchLabels: app = api</text><text x="94" y="374" font-family="DejaVu Sans Mono, sans-serif" font-size="26" font-weight="400" fill="#202126" text-anchor="start">AND app NotIn [api]</text><path d="M94 406 H726" stroke="#dcdfe3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="451" font-family="DejaVu Sans Mono, sans-serif" font-size="26" font-weight="400" fill="#202126" text-anchor="start">Pod label: app = api</text><text x="94" y="524" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#656a74" text-anchor="start">Old verdict</text><text x="726" y="524" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#656a74" text-anchor="end">PASS</text><text x="94" y="592" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#202126" text-anchor="start">Corrected verdict</text><text x="726" y="592" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#b34b14" text-anchor="end">FAIL</text><rect x="844" y="219" width="692" height="420" rx="16" fill="#f5f5f4"/><text x="874" y="270" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#202126" text-anchor="start">Compatible extra label</text><text x="874" y="330" font-family="DejaVu Sans Mono, sans-serif" font-size="26" font-weight="400" fill="#202126" text-anchor="start">Selector: app = api</text><text x="874" y="374" font-family="DejaVu Sans Mono, sans-serif" font-size="26" font-weight="400" fill="#202126" text-anchor="start">Pod label: app = api</text><path d="M874 406 H1506" stroke="#dcdfe3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="874" y="451" font-family="DejaVu Sans Mono, sans-serif" font-size="26" font-weight="400" fill="#202126" text-anchor="start">Extra label: team = platform</text><text x="874" y="524" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#656a74" text-anchor="start">Old verdict</text><text x="1506" y="524" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#656a74" text-anchor="end">FAIL</text><text x="874" y="592" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#202126" text-anchor="start">Corrected verdict</text><text x="1506" y="592" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#202126" text-anchor="end">PASS</text><path d="M64 690 H1536" stroke="#dcdfe3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="745" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#202126" text-anchor="middle">Test a valid answer, a targeted error, and a harmless change.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="816" viewBox="0 0 1600 816" role="img" aria-labelledby="title desc"><title id="title">evidence</title><desc id="desc">A saved bulk-reading program fails at a 64 MiB address-space limit and returns the correct total at 256 MiB. Each attempt retains its own hashes, limits, output, error text, exit status, timing, resource usage and answer check.</desc><rect width="1600" height="816" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#007d70" text-anchor="start">PRESERVING THE EVIDENCE</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="51" font-weight="700" fill="#07213c" text-anchor="start">A retry adds a record.</text><text x="64" y="168" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#486675" text-anchor="start">Replay the saved code and input. Record the condition that changed.</text><rect x="64" y="221" width="622" height="207" rx="18" fill="#edf9f5" stroke="none" stroke-width="2"/><rect x="914" y="221" width="622" height="207" rx="18" fill="#edf9f5" stroke="none" stroke-width="2"/><text x="94" y="267" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#07213c" text-anchor="start">Original attempt</text><text x="94" y="321" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#486675" text-anchor="start">64 MiB address-space limit</text><text x="94" y="384" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#07213c" text-anchor="start">MemoryError</text><text x="944" y="267" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#07213c" text-anchor="start">Diagnostic rerun</text><text x="944" y="321" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#486675" text-anchor="start">256 MiB address-space limit</text><text x="944" y="384" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#007d70" text-anchor="start">Correct total</text><path d="M716 327 H884 M870 313 L884 327 L870 341" fill="none" stroke="#007d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="301" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#007d70" text-anchor="middle">New limit</text><text x="64" y="492" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#07213c" text-anchor="start">Each attempt keeps its own</text><rect x="64" y="536" width="432" height="54" rx="10" fill="white" stroke="#c6e5dc" stroke-width="2"/><text x="84" y="572" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#07213c" text-anchor="start">Code + input hashes</text><rect x="584" y="536" width="432" height="54" rx="10" fill="white" stroke="#c6e5dc" stroke-width="2"/><text x="604" y="572" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#07213c" text-anchor="start">Resource limits</text><rect x="1104" y="536" width="432" height="54" rx="10" fill="white" stroke="#c6e5dc" stroke-width="2"/><text x="1124" y="572" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#07213c" text-anchor="start">stdout + stderr</text><rect x="64" y="609" width="432" height="54" rx="10" fill="white" stroke="#c6e5dc" stroke-width="2"/><text x="84" y="645" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#07213c" text-anchor="start">Exit status</text><rect x="584" y="609" width="432" height="54" rx="10" fill="white" stroke="#c6e5dc" stroke-width="2"/><text x="604" y="645" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#07213c" text-anchor="start">Timing + resource usage</text><rect x="1104" y="609" width="432" height="54" rx="10" fill="white" stroke="#c6e5dc" stroke-width="2"/><text x="1124" y="645" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#07213c" text-anchor="start">Answer check</text><path d="M64 708 H1536" fill="none" stroke="#c6e5dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="764" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#07213c" text-anchor="middle">Keep both records, even when the rerun passes.</text></svg>
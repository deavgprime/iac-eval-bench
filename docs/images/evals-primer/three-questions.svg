<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="804" viewBox="0 0 1600 804" role="img" aria-labelledby="title desc"><title id="title">three-questions</title><desc id="desc">For a task requesting three replicas, a JSON excerpt specifying two is readable but fails the requested replica count. It cannot establish schema validity or runtime behavior.</desc><rect width="1600" height="804" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#246592" text-anchor="start">ONE ANSWER, THREE QUESTIONS</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="49" font-weight="700" fill="#182735" text-anchor="start">Readable output can still miss the task.</text><text x="64" y="169" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#62707b" text-anchor="start">Requested: a Deployment with three replicas.</text><rect x="64" y="214" width="1472" height="80" rx="16" fill="#f0f5f9"/><text x="94" y="266" font-family="DejaVu Sans Mono, sans-serif" font-size="31" font-weight="400" fill="#246592" text-anchor="start">{&quot;spec&quot;: {&quot;replicas&quot;: 2}}</text><rect x="64" y="345" width="432" height="298" rx="16" fill="#f0f5f9"/><text x="89" y="397" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#182735" text-anchor="start">Structure</text><text x="89" y="443" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">Can we read the JSON?</text><text x="89" y="511" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#246592" text-anchor="start">YES</text><text x="89" y="567" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62707b" text-anchor="start">The excerpt is</text><text x="89" y="605" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62707b" text-anchor="start">readable JSON.</text><rect x="584" y="345" width="432" height="298" rx="16" fill="#fff0e6"/><text x="609" y="397" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#182735" text-anchor="start">Requirement</text><text x="609" y="443" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">Did it provide three?</text><text x="609" y="511" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#b94d16" text-anchor="start">NO</text><text x="609" y="567" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62707b" text-anchor="start">It specifies two</text><text x="609" y="605" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62707b" text-anchor="start">replicas, not three.</text><rect x="1104" y="345" width="432" height="298" rx="16" fill="#f0f5f9"/><text x="1129" y="397" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#182735" text-anchor="start">Behavior</text><text x="1129" y="443" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#62707b" text-anchor="start">Does it work deployed?</text><text x="1129" y="511" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#182735" text-anchor="start">NOT ESTABLISHED</text><text x="1129" y="567" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62707b" text-anchor="start">Needs a full configuration</text><text x="1129" y="605" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#62707b" text-anchor="start">and a runtime check.</text><path d="M64 696 H1536" stroke="#dce3e8" stroke-width="2"/><text x="800" y="752" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#62707b" text-anchor="middle">Parsing this excerpt is not a full Kubernetes schema check.</text></svg>

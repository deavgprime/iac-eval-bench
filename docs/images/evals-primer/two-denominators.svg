<circle cx="1150" cy="265" r="43" fill="#78818a"/>
<circle cx="1151" cy="264" r="47" fill="none" stroke="#78818a" stroke-width="1"/>
<circle cx="1150" cy="265" r="24" fill="none" stroke="#fcf9ef" stroke-width="4"/>

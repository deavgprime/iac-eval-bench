<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="765" viewBox="0 0 1600 765" role="img" aria-labelledby="title desc"><title id="title">durable-boundaries</title><desc id="desc">The caller saves an action key before sending. Every attempt reuses that key. The service commits the order and replay receipt in one transaction, then replays its result for a repeated request.</desc><rect width="1600" height="765" fill="white"/><text x="64" y="58" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#21775c" text-anchor="start">TWO DURABLE BOUNDARIES</text><text x="64" y="126" font-family="DejaVu Sans,sans-serif" font-size="48" font-weight="700" fill="#172d3c" text-anchor="start">Keep the action identity. Commit its result.</text><rect x="64" y="200" width="420" height="300" rx="16" fill="#f3f6f7"/><text x="94" y="250" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d3c" text-anchor="start">Caller journal</text><text x="94" y="314" font-family="DejaVu Sans Mono,sans-serif" font-size="30" font-weight="400" fill="#172d3c" text-anchor="start">action-1</text><text x="94" y="365" font-family="DejaVu Sans Mono,sans-serif" font-size="30" font-weight="400" fill="#172d3c" text-anchor="start">key: 9f2a...</text><text x="94" y="453" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#596975" text-anchor="start">Save before the first send.</text><path d="M500 347 H610" stroke="#21775c" stroke-width="3" fill="none"/><path d="M600 339 L610 347 L600 355" stroke="#21775c" stroke-width="3" fill="none"/><rect x="626" y="200" width="330" height="300" rx="16" fill="#f3f6f7"/><text x="656" y="250" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#172d3c" text-anchor="start">HTTP tool call</text><text x="656" y="320" font-family="DejaVu Sans Mono,sans-serif" font-size="28" font-weight="400" fill="#172d3c" text-anchor="start">POST /orders</text><text x="656" y="372" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#21775c" text-anchor="start">same key</text><text x="656" y="453" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#596975" text-anchor="start">Reuse on each attempt.</text><path d="M972 347 H1082" stroke="#21775c" stroke-width="3" fill="none"/><path d="M1072 339 L1082 347 L1072 355" stroke="#21775c" stroke-width="3" fill="none"/><rect x="1098" y="200" width="438" height="300" rx="16" fill="#d8f2e9"/><text x="1128" y="250" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#172d3c" text-anchor="start">Service database</text><text x="1128" y="320" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#172d3c" text-anchor="start">Order + replay receipt</text><text x="1128" y="372" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#21775c" text-anchor="start">one transaction</text><text x="1128" y="453" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#596975" text-anchor="start">Commit both or neither.</text><rect x="64" y="557" width="1472" height="98" rx="16" fill="#f3f6f7"/><text x="800" y="616" font-family="DejaVu Sans,sans-serif" font-size="31" font-weight="700" fill="#172d3c" text-anchor="middle">A repeat returns the stored order ID and response.</text><text x="64" y="716" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#596975" text-anchor="start">Schematic of the local test. The HTTP request can still be delivered more than once.</text></svg>

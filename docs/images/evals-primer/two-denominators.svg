<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">Same run. Two percentages.</title>
<desc id="desc">Ten illustrative attempts: six pass, two fail, two time out. Excluding the two timeouts gives six out of eight, or 75 percent. Including all attempts gives six out of ten, or 60 percent.</desc>

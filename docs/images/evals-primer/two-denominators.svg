<text x="70" y="95" font-family="Noto Serif, serif" font-size="50" font-weight="700" text-anchor="start" fill="#172b43">Same run. Two percentages.</text>
<text x="70" y="150" font-family="Noto Serif, serif" font-size="27" font-weight="400" text-anchor="start" fill="#58616a">An illustrative run, not a model measurement</text>

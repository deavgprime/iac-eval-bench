<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="793" viewBox="0 0 1600 793" role="img" aria-labelledby="title desc"><title id="title">evaluator-inspection</title><desc id="desc">Response format, Kubernetes schema, required resources and task requirements are checked. The answer and results are saved. The evaluator does not deploy the workload.</desc><rect width="1600" height="793" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#b34b14" text-anchor="start">THE STATIC EVALUATOR</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="49" font-weight="700" fill="#202126" text-anchor="start">Four stages inspect the submitted answer.</text><text x="64" y="168" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#656a74" text-anchor="start">The task requirements are available when the answer is scored.</text><rect x="64" y="230" width="332" height="267" rx="16" fill="#f5f5f4"/><rect x="88" y="254" width="49" height="49" rx="24" fill="#fff0e6"/><text x="112" y="288" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#b34b14" text-anchor="middle">1</text><text x="88" y="359" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202126" text-anchor="start">Response format</text><text x="88" y="413" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">Expected JSON</text><text x="88" y="453" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">structure</text><path d="M406 366 H434 M424 356 L434 366 L424 376" stroke="#b34b14" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="444" y="230" width="332" height="267" rx="16" fill="#f5f5f4"/><rect x="468" y="254" width="49" height="49" rx="24" fill="#fff0e6"/><text x="492" y="288" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#b34b14" text-anchor="middle">2</text><text x="468" y="359" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202126" text-anchor="start">Kubernetes schema</text><text x="468" y="413" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">Allowed fields</text><text x="468" y="453" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">and field types</text><path d="M786 366 H814 M804 356 L814 366 L804 376" stroke="#b34b14" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="824" y="230" width="332" height="267" rx="16" fill="#f5f5f4"/><rect x="848" y="254" width="49" height="49" rx="24" fill="#fff0e6"/><text x="872" y="288" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#b34b14" text-anchor="middle">3</text><text x="848" y="359" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202126" text-anchor="start">Required resources</text><text x="848" y="413" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">Kinds, names</text><text x="848" y="453" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">and namespaces</text><path d="M1166 366 H1194 M1184 356 L1194 366 L1184 376" stroke="#b34b14" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1204" y="230" width="332" height="267" rx="16" fill="#f5f5f4"/><rect x="1228" y="254" width="49" height="49" rx="24" fill="#fff0e6"/><text x="1252" y="288" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#b34b14" text-anchor="middle">4</text><text x="1228" y="359" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202126" text-anchor="start">Task requirements</text><text x="1228" y="413" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">Selectors, ports</text><text x="1228" y="453" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656a74" text-anchor="start">limits and more</text><rect x="64" y="548" width="1472" height="85" rx="16" fill="#fff0e6"/><text x="800" y="602" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#202126" text-anchor="middle">Save the answer and its check results as evidence.</text><path d="M64 684 H1536" stroke="#dcdfe3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="740" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#656a74" text-anchor="middle">Static checks do not deploy a workload or establish runtime behavior.</text></svg>
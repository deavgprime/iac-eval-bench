<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="915" viewBox="0 0 1600 915" role="img" aria-labelledby="title desc"><title id="title">Resume a fixture run without replacing saved attempts</title><desc id="desc">After interruption, one record is saved and one is missing. A resume reuses the first record and makes one fixture call. A second resume makes zero calls. Changed configuration, inputs or evaluator reject the resume.</desc><rect width="1600" height="915" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#b74c28" text-anchor="start">CONTINUING A TWO-TASK FIXTURE RUN</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="49" font-weight="700" fill="#202125" text-anchor="start">Continue missing work. Keep saved attempts.</text><text x="64" y="169" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#656971" text-anchor="start">The run plan stays fixed while the missing record is completed.</text><rect x="64" y="223" width="432" height="353" rx="16" fill="#f5f5f4"/><text x="89" y="274" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#202125" text-anchor="start">Interrupted</text><text x="89" y="319" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#656971" text-anchor="start">1 saved record</text><rect x="89" y="355" width="382" height="62" rx="12" fill="white"/><text x="108" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202125" text-anchor="start">Attempt 1: saved</text><rect x="89" y="437" width="382" height="62" rx="12" fill="#fff0e8"/><text x="108" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#b74c28" text-anchor="start">Attempt 2: missing</text><text x="89" y="545" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#656971" text-anchor="start">Second call interrupted</text><rect x="584" y="223" width="432" height="353" rx="16" fill="#f5f5f4"/><text x="609" y="274" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#202125" text-anchor="start">Resume missing work</text><text x="609" y="319" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#656971" text-anchor="start">1 fixture call</text><rect x="609" y="355" width="382" height="62" rx="12" fill="white"/><text x="628" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202125" text-anchor="start">Attempt 1: reused</text><rect x="609" y="437" width="382" height="62" rx="12" fill="white"/><text x="628" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202125" text-anchor="start">Attempt 2: completed</text><text x="609" y="545" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#656971" text-anchor="start">First file stays unchanged</text><rect x="1104" y="223" width="432" height="353" rx="16" fill="#f5f5f4"/><text x="1129" y="274" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#202125" text-anchor="start">Resume completed run</text><text x="1129" y="319" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#656971" text-anchor="start">0 fixture calls</text><rect x="1129" y="355" width="382" height="62" rx="12" fill="white"/><text x="1148" y="396" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202125" text-anchor="start">Attempt 1: reused</text><rect x="1129" y="437" width="382" height="62" rx="12" fill="white"/><text x="1148" y="478" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#202125" text-anchor="start">Attempt 2: reused</text><text x="1129" y="545" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#656971" text-anchor="start">Same summary</text><path d="M511 400 H569 M557 388 L569 400 L557 412" stroke="#b74c28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1031 400 H1089 M1077 388 L1089 400 L1077 412" stroke="#b74c28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="627" width="1472" height="130" rx="16" fill="#fff0e8"/><text x="94" y="675" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#202125" text-anchor="start">Before continuing</text><text x="94" y="722" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#656971" text-anchor="start">Configuration, inputs and evaluator must match.</text><text x="1499" y="699" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#b74c28" text-anchor="end">Changed? Resume rejected.</text><path d="M64 807 H1536" stroke="#dddfe1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="862" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#202125" text-anchor="middle">A saved provider error stays recorded. A retry is a separate decision.</text></svg>
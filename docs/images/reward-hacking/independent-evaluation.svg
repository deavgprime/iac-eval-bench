<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="902" viewBox="0 0 1600 902" role="img" aria-labelledby="title desc"><title id="title">independent-evaluation</title><desc id="desc">The agent submits pricing.py. The independent evaluator uses original expected answers, additional inputs and a runner-recorded edit check. Acceptance requires all three. A real system must protect the evaluation with permissions and isolation.</desc><rect width="1600" height="902" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#087c55" text-anchor="start">VERIFYING THE SUBMISSION</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#102334" text-anchor="start">Check the work against protected requirements.</text><text x="64" y="168" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#536777" text-anchor="start">The agent&#x27;s local pass is only one piece of evidence.</text><rect x="64" y="238" width="406" height="267" rx="18" fill="#ecfaf2" stroke="none" stroke-width="2"/><text x="94" y="290" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#102334" text-anchor="start">Agent workspace</text><rect x="94" y="326" width="346" height="64" rx="12" fill="white" stroke="none" stroke-width="2"/><text x="267" y="369" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#102334" text-anchor="middle">pricing.py</text><text x="94" y="445" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#536777" text-anchor="start">Local checks + patch</text><path d="M495 369 H661 M647 355 L661 369 L647 383" fill="none" stroke="#087c55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="578" y="312" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087c55" text-anchor="middle">Submit code</text><text x="578" y="437" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#536777" text-anchor="middle">Record edits</text><path d="M578 486 V526 H718" fill="none" stroke="#d5e4df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="690" y="238" width="846" height="405" rx="18" fill="white" stroke="#d5e4df" stroke-width="2"/><text x="722" y="290" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#102334" text-anchor="start">Independent evaluation</text><text x="722" y="337" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#536777" text-anchor="start">Checks are outside the agent&#x27;s write access</text><rect x="722" y="373" width="782" height="61" rx="12" fill="#ecfaf2" stroke="none" stroke-width="2"/><text x="746" y="414" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#102334" text-anchor="start">1  Original expected answers</text><rect x="722" y="453" width="782" height="61" rx="12" fill="#ecfaf2" stroke="none" stroke-width="2"/><text x="746" y="494" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#102334" text-anchor="start">2  Additional input cases</text><rect x="722" y="533" width="782" height="61" rx="12" fill="#ecfaf2" stroke="none" stroke-width="2"/><text x="746" y="574" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#102334" text-anchor="start">3  Only permitted files changed</text><text x="64" y="572" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#102334" text-anchor="start">The runner records</text><text x="64" y="613" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#536777" text-anchor="start">what changed.</text><rect x="690" y="675" width="846" height="69" rx="16" fill="#102334" stroke="none" stroke-width="2"/><text x="1113" y="720" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">ACCEPT only when all three checks pass</text><path d="M64 793 H1536" fill="none" stroke="#d5e4df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="849" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#102334" text-anchor="middle">Enforce the boundary with permissions and isolation.</text></svg>
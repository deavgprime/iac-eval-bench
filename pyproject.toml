[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-eval-bench"
version = "0.2.0"
description = "Reproducible static evaluation of LLM-generated Kubernetes configuration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Deavyansh Gautam"}]
dependencies = ["jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/deavgprime/iac-eval-bench"
Issues = "https://github.com/deavgprime/iac-eval-bench/issues"

[project.scripts]
iac-eval = "iac_eval_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iac_eval_bench = ["data/*.json", "data/schemas/*.json", "data/schemas/UPSTREAM-LICENSE", "data/schemas/APACHE-2.0.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="818" viewBox="0 0 1600 818" role="img" aria-labelledby="title desc"><title id="title">contract</title><desc id="desc">Both cases produce MemoryError at a 64 MiB address-space limit. If the task promised 256 MiB, the setup failed. If it required 64 MiB, the solution failed the task.</desc><rect width="1600" height="818" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#007d70" text-anchor="start">CLASSIFYING THE FAILURE</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="51" font-weight="700" fill="#07213c" text-anchor="start">Same error. Different finding.</text><text x="64" y="168" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#486675" text-anchor="start">Bulk-reading program, fixed input and unchanged code</text><rect x="64" y="217" width="692" height="390" rx="18" fill="#edf9f5" stroke="none" stroke-width="2"/><text x="94" y="267" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#07213c" text-anchor="start">The runner broke the contract</text><text x="94" y="326" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#486675" text-anchor="start">Task promised</text><text x="724" y="326" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#07213c" text-anchor="end">256 MiB</text><path d="M94 350 H724" fill="none" stroke="#c6e5dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="393" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#486675" text-anchor="start">Runner applied</text><text x="724" y="393" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#07213c" text-anchor="end">64 MiB</text><rect x="94" y="428" width="632" height="64" rx="12" fill="white" stroke="none" stroke-width="2"/><text x="410" y="470" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#07213c" text-anchor="middle">MemoryError</text><text x="94" y="544" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#007d70" text-anchor="start">Setup failure</text><text x="94" y="583" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#486675" text-anchor="start">Runner supplied less than promised</text><rect x="844" y="217" width="692" height="390" rx="18" fill="#edf9f5" stroke="none" stroke-width="2"/><text x="874" y="267" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#07213c" text-anchor="start">The solution exceeded the budget</text><text x="874" y="326" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#486675" text-anchor="start">Task promised</text><text x="1504" y="326" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#07213c" text-anchor="end">64 MiB</text><path d="M874 350 H1504" fill="none" stroke="#c6e5dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="874" y="393" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#486675" text-anchor="start">Runner applied</text><text x="1504" y="393" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#07213c" text-anchor="end">64 MiB</text><rect x="874" y="428" width="632" height="64" rx="12" fill="white" stroke="none" stroke-width="2"/><text x="1190" y="470" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#07213c" text-anchor="middle">MemoryError</text><text x="874" y="544" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#007d70" text-anchor="start">Task failure</text><text x="874" y="583" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#486675" text-anchor="start">Solution failed within the stated limit</text><text x="800" y="674" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#486675" text-anchor="middle">All limits shown are address-space limits (RLIMIT_AS).</text><path d="M64 712 H1536" fill="none" stroke="#c6e5dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="767" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#07213c" text-anchor="middle">The task requirements decide what the error means.</text></svg>
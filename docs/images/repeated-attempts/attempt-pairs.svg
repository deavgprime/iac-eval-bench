<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="974" viewBox="0 0 1600 974" role="img" aria-labelledby="title desc"><title id="title">Six pairs from four constructed attempts</title><desc id="desc">Five pairs contain at least one pass. Only AC contains two passes.</desc><rect width="1600" height="974" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#23599a" text-anchor="start">FOUR CONSTRUCTED ATTEMPTS</text><text x="64" y="117" font-family="DejaVu Sans, sans-serif" font-size="49" font-weight="700" fill="#10263f" text-anchor="start">The same pairs. Two different questions.</text><rect x="64" y="165" width="332" height="65" rx="14" fill="#f1f5fa"/><text x="230" y="208" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#23599a" text-anchor="middle">A: PASS</text><rect x="444" y="165" width="332" height="65" rx="14" fill="#fff1ec"/><text x="610" y="208" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#cb4f3b" text-anchor="middle">B: FAIL</text><rect x="824" y="165" width="332" height="65" rx="14" fill="#f1f5fa"/><text x="990" y="208" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#23599a" text-anchor="middle">C: PASS</text><rect x="1204" y="165" width="332" height="65" rx="14" fill="#fff1ec"/><text x="1370" y="208" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#cb4f3b" text-anchor="middle">D: FAIL</text><path d="M64 278 H1536" stroke="#e0e5ec" stroke-width="2"/><text x="92" y="323" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#10263f" text-anchor="start">Pair</text><text x="320" y="323" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#10263f" text-anchor="start">Grades</text><text x="885" y="323" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#10263f" text-anchor="middle">At least one passes</text><text x="1350" y="323" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#10263f" text-anchor="middle">Both pass</text><text x="92" y="382" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#10263f" text-anchor="start">AB</text><text x="320" y="382" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#58697a" text-anchor="start">Pass, Fail</text><text x="885" y="382" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#23599a" text-anchor="middle">YES</text><text x="1350" y="382" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#cb4f3b" text-anchor="middle">NO</text><text x="92" y="447" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#10263f" text-anchor="start">AC</text><text x="320" y="447" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#58697a" text-anchor="start">Pass, Pass</text><text x="885" y="447" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#23599a" text-anchor="middle">YES</text><text x="1350" y="447" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#23599a" text-anchor="middle">YES</text><text x="92" y="512" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#10263f" text-anchor="start">AD</text><text x="320" y="512" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#58697a" text-anchor="start">Pass, Fail</text><text x="885" y="512" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#23599a" text-anchor="middle">YES</text><text x="1350" y="512" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#cb4f3b" text-anchor="middle">NO</text><text x="92" y="577" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#10263f" text-anchor="start">BC</text><text x="320" y="577" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#58697a" text-anchor="start">Fail, Pass</text><text x="885" y="577" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#23599a" text-anchor="middle">YES</text><text x="1350" y="577" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#cb4f3b" text-anchor="middle">NO</text><text x="92" y="642" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#10263f" text-anchor="start">BD</text><text x="320" y="642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#58697a" text-anchor="start">Fail, Fail</text><text x="885" y="642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#cb4f3b" text-anchor="middle">NO</text><text x="1350" y="642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#cb4f3b" text-anchor="middle">NO</text><text x="92" y="707" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#10263f" text-anchor="start">CD</text><text x="320" y="707" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#58697a" text-anchor="start">Pass, Fail</text><text x="885" y="707" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#23599a" text-anchor="middle">YES</text><text x="1350" y="707" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#cb4f3b" text-anchor="middle">NO</text><path d="M64 746 H1536" stroke="#e0e5ec" stroke-width="2"/><rect x="64" y="778" width="1472" height="88" rx="14" fill="#f1f5fa"/><text x="104" y="833" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#23599a" text-anchor="start">At least one: 5/6 (83.3%)</text><text x="1510" y="833" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#cb4f3b" text-anchor="end">Both: 1/6 (16.7%)</text><text x="800" y="925" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#58697a" text-anchor="middle">The six pairs reuse four attempts. They are not six independent trials.</text></svg>
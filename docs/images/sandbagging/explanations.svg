<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title desc"><title id="title">explanations</title><desc id="desc">A low score branches to inability, refusal, setup failure and sandbagging. The score alone does not establish the cause.</desc><rect width="1600" height="710" fill="white"/><text x="64" y="49" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#0755e9" text-anchor="start">READING THE RESULT</text><text x="64" y="116" font-family="DejaVu Sans, sans-serif" font-size="49" font-weight="700" fill="#071d49" text-anchor="start">One low score. Four possible explanations.</text><rect x="677" y="172" width="246" height="70" rx="35" fill="#071d49" stroke="none" stroke-width="2"/><text x="800" y="218" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="white" text-anchor="middle">LOW SCORE</text><path d="M800 242 V280 M230 280 H1370" stroke="#cdddf4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M230 280 V320" stroke="#cdddf4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="230" cy="357" r="37" fill="#eef5ff"/><path d="M610 280 V320" stroke="#cdddf4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="610" cy="357" r="37" fill="#eef5ff"/><path d="M990 280 V320" stroke="#cdddf4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="990" cy="357" r="37" fill="#eef5ff"/><path d="M1370 280 V320" stroke="#cdddf4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1370" cy="357" r="37" fill="#eef5ff"/><path d="M213 343 H247 V359 M247 369 V375 H213 V343" stroke="#0755e9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M593 340 L627 374 M627 340 L593 374" stroke="#0755e9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M975 344 H982 M975 344 C957 344 957 370 975 370 H982 M998 344 H1005 C1023 344 1023 370 1005 370 H998" stroke="#0755e9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M986 350 L994 364" stroke="#4a607c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1350 345 H1390 M1350 369 H1390" stroke="#0755e9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1360" cy="345" r="6" fill="#0755e9"/><circle cx="1380" cy="369" r="6" fill="#0755e9"/><text x="230" y="445" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#071d49" text-anchor="middle">Inability</text><text x="230" y="493" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">Cannot solve the task</text><text x="230" y="532" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">under this setup</text><text x="610" y="445" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#071d49" text-anchor="middle">Refusal</text><text x="610" y="493" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">Declines the request</text><text x="610" y="532" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">because of an instruction</text><text x="990" y="445" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#071d49" text-anchor="middle">Setup failure</text><text x="990" y="493" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">Tools, dependencies</text><text x="990" y="532" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">or budget get in the way</text><text x="1370" y="445" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#071d49" text-anchor="middle">Sandbagging</text><text x="1370" y="493" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">Strategically produces</text><text x="1370" y="532" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#4a607c" text-anchor="middle">a weaker result</text><path d="M64 591 H1536" stroke="#cdddf4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="653" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#071d49" text-anchor="middle">The score alone cannot tell them apart.</text></svg>